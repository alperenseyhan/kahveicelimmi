<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>kahve içelim mi? ☕️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F8F4E1;
    --ink: #543310;
    --ink-soft: rgba(62,39,35,0.55);
    --evet: #AF8F6F;
    --evet-dark: #74512D;
    --evet-ink: #FFF7EC;
    --hayir-border: rgba(62,39,35,0.28);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overscroll-behavior: none;
  }

  body{
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .stage{
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12vh 6vw 8vh;
    position: relative;
    overflow: hidden;
  }

  .headline{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 8vw, 2.4rem);
    text-align: center;
    margin: 0 0 auto;
    letter-spacing: -0.01em;
    transition: opacity .35s ease, transform .35s ease;
  }

  .headline.fade{
    opacity: 0;
    transform: translateY(-10px);
  }

  .buttons{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-top: auto;
    width: 100%;
  }

  .btn{
    font-family: 'DM Sans', sans-serif;
    border: none;
    cursor: pointer;
    font-weight: 700;
    border-radius: 999px;
    transition: all .45s cubic-bezier(.34,1.56,.64,1);
    -webkit-user-select: none;
    user-select: none;
  }

  .evet{
    background: var(--evet);
    color: var(--evet-ink);
    box-shadow: 0 8px 20px rgba(156,95,39,0.35);
    padding: 18px 40px;
    font-size: 1.05rem;
    position: relative;
    z-index: 5;
  }
  .evet:active{ background: var(--evet-dark); }

  .evet[data-step="1"]{ padding: 22px 48px; font-size: 1.2rem; }
  .evet[data-step="2"]{ padding: 28px 58px; font-size: 1.4rem; }
  .evet[data-step="3"]{ padding: 36px 70px; font-size: 1.65rem; }
  .evet[data-step="4"]{ padding: 46px 84px; font-size: 1.95rem; }
  .evet[data-step="5"]{ padding: 58px 100px; font-size: 2.25rem; }

  .evet.full{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
    padding: 0;
    display: block;
    z-index: 50;
    box-shadow: none;
    cursor: default;
  }

  .form-wrap{
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg);
  }

  .form-header{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--ink);
    text-align: center;
    padding: 18px 16px 12px;
    flex-shrink: 0;
  }

  .steam{
    font-size: 1.4rem;
    display: inline-block;
    animation: float 2.2s ease-in-out infinite;
    margin-right: 6px;
  }

  .form-frame{
    flex: 1;
    width: 100%;
    border: none;
  }

  @keyframes float{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .hayir{
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--hayir-border);
    padding: 14px 30px;
    font-size: 0.95rem;
    opacity: 1;
    transform: scale(1);
  }

  .hayir[data-step="1"]{ opacity: 0.85; transform: scale(0.95); font-size: 0.9rem; }
  .hayir[data-step="2"]{ opacity: 0.7;  transform: scale(0.9);  font-size: 0.85rem; }
  .hayir[data-step="3"]{ opacity: 0.55; transform: scale(0.85); font-size: 0.8rem; }
  .hayir[data-step="4"]{ opacity: 0.4;  transform: scale(0.8);  font-size: 0.75rem; }
  .hayir[data-step="5"]{ opacity: 0.25; transform: scale(0.75); font-size: 0.7rem; }

  .hayir.hidden{
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce){
    .btn, .headline, .steam{ transition: none; animation: none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <h1 class="headline" id="headline">kahve içelim mi? ☕️</h1>

    <div class="buttons">
      <button class="btn evet" id="evetBtn" data-step="0">evet</button>
      <button class="btn hayir" id="hayirBtn" data-step="0">hayır</button>
    </div>
  </div>

<script>
  const evetBtn = document.getElementById('evetBtn');
  const hayirBtn = document.getElementById('hayirBtn');
  const headline = document.getElementById('headline');

  const hayirPhrases = [
    "hayır",
    "hayır 😔",
    "hayır 🥺",
    "hayır 😭",
    "hayır 😡",
    "💔"
  ];

  const evetLabels = [
    "evet",
    "evett",
    "evett!",
    "evett!!",
    "EVET!",
    "EVET!!"
  ];

  let step = 0;
  const maxStep = hayirPhrases.length - 1; // 5

  hayirBtn.addEventListener('click', () => {
    if (step >= maxStep) {
      goFull();
      return;
    }
    step++;
    hayirBtn.textContent = hayirPhrases[step];
    hayirBtn.setAttribute('data-step', step);
    evetBtn.textContent = evetLabels[step];
    evetBtn.setAttribute('data-step', step);
  });

  evetBtn.addEventListener('click', () => {
    if (!evetBtn.classList.contains('full')) {
      goFull();
    }
  });

  const FORM_EMBED_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeLawQiSeQehWz4BTvhz5fXi4Q0KmVuaieIx7dWpSn2nx9VsQ/viewform?embedded=true";

  function goFull(){
    evetBtn.classList.add('full');
    evetBtn.removeAttribute('data-step');
    evetBtn.innerHTML =
      '<div class="form-wrap">' +
        '<div class="form-header"><span class="steam">☕</span>harika, hadi bir tarih seçelim</div>' +
        '<iframe class="form-frame" src="' + FORM_EMBED_URL + '" loading="lazy">Yükleniyor…</iframe>' +
      '</div>';
    hayirBtn.classList.add('hidden');
    headline.classList.add('fade');
  }
</script>

</body>
</html>
